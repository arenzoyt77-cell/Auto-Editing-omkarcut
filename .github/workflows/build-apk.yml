name: Build OMKAR AUTOCUT Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK (Ubuntu Latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses and install required SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare .env configuration from .env.example
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "${GEMINI_API_KEY_SECRET}" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}" >> .env
          fi

      - name: Prepare debug.keystore for debug signing config
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK exists
        run: |
          APK_FILE=$(find . -path "*/build/outputs/apk/*.apk" -type f | head -n 1)
          if [ -z "${APK_FILE}" ] || [ ! -s "${APK_FILE}" ]; then
            echo "ERROR: No generated APK found under **/build/outputs/apk/"
            exit 1
          fi
          echo "Verified generated APK: ${APK_FILE}"
          ls -lh "${APK_FILE}"

      - name: Upload OMKAR-AUTOCUT-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOCUT-APK
          path: |
            **/*.apk
            !**/androidTest/**/*.apk
          if-no-files-found: error
          retention-days: 30
