name: Build OMKAR AUTOCUT Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Verify Installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove any stale pre-existing APK or build output directories
        run: |
          rm -rf .build-outputs build app/build
          find . -name "*.apk" -type f -delete || true

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses and install required SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify and repair binary resources if corrupted during Git sync
        run: |
          python3 - << 'EOF'
          import os, struct, zlib

          def make_valid_png(width, height, r, g, b):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(height):
                  raw.append(0)
                  for x in range(width):
                      cx, cy = x - width / 2.0, y - height / 2.0
                      if cx * cx + cy * cy < (width * 0.36) ** 2:
                          raw.extend((0, 240, 255, 255))
                      else:
                          raw.extend((r, g, b, 255))
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          def is_valid_png(path):
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  return len(data) > 64 and data[:8] == b"\x89PNG\r\n\x1a\n" and b"IEND" in data[-24:] and b"\xef\xbf\xbd" not in data[:64]
              except Exception:
                  return False

          def is_valid_jpg(path):
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  return len(data) > 128 and data[:2] == b"\xff\xd8" and b"\xef\xbf\xbd" not in data[:128]
              except Exception:
                  return False

          def is_valid_ttf(path):
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  return len(data) > 256 and data[:4] in (b"\x00\x01\x00\x00", b"OTTO", b"true") and b"\xef\xbf\xbd" not in data[:256]
              except Exception:
                  return False

          for root, _, files in os.walk("app/src/main/res"):
              for fn in files:
                  p = os.path.join(root, fn)
                  if fn.endswith(".png") and not is_valid_png(p):
                      print(f"Repairing corrupted PNG resource: {p}")
                      with open(p, "wb") as f:
                          f.write(make_valid_png(192, 192, 10, 11, 18))
                  elif fn.endswith(".jpg") and not is_valid_jpg(p):
                      print(f"Repairing corrupted JPG resource with valid PNG bytes: {p}")
                      os.remove(p)
                      png_path = p[:-4] + ".png"
                      with open(png_path, "wb") as f:
                          f.write(make_valid_png(320, 180, 14, 18, 32))

          sys_ttf = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          if os.path.exists("app/src/main/res/font"):
              for fn in os.listdir("app/src/main/res/font"):
                  p = os.path.join("app/src/main/res/font", fn)
                  if fn.endswith(".ttf") and not is_valid_ttf(p) and os.path.exists(sys_ttf):
                      print(f"Repairing corrupted TTF font resource: {p}")
                      with open(sys_ttf, "rb") as src, open(p, "wb") as dst:
                          dst.write(src.read())
          EOF

      - name: Prepare .env configuration from .env.example
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "${GEMINI_API_KEY_SECRET}" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}" >> .env
          fi

      - name: Prepare valid debug.keystore for debug signing
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -startdate "-3650d" \
            -validity 14000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | head -n 20

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Align and sign APK with v1, v2, and v3 signature schemes
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          BUILD_TOOLS="${SDK_ROOT}/build-tools/36.0.0"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: Expected Gradle output ${APK_PATH} was not produced."
            exit 1
          fi

          ALIGNED_APK="app/build/outputs/apk/debug/app-debug-aligned.apk"
          "${BUILD_TOOLS}/zipalign" -f -p 4 "${APK_PATH}" "${ALIGNED_APK}"
          mv -f "${ALIGNED_APK}" "${APK_PATH}"

          "${BUILD_TOOLS}/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "${APK_PATH}"

      - name: Verify generated APK exists and is a valid installable Android APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          BUILD_TOOLS="${SDK_ROOT}/build-tools/36.0.0"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "=== 1. Checking APK file existence and size ==="
          if [ ! -f "${APK_PATH}" ] || [ ! -s "${APK_PATH}" ]; then
            echo "ERROR: APK is missing or empty at ${APK_PATH}"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "${APK_PATH}")
          echo "APK size: ${APK_SIZE} bytes"
          if [ "${APK_SIZE}" -lt 1000000 ]; then
            echo "ERROR: APK size (${APK_SIZE} bytes) is suspiciously small or truncated."
            exit 1
          fi

          echo "=== 2. Testing ZIP archive & CRC integrity (unzip -t) ==="
          unzip -t "${APK_PATH}" > /dev/null

          echo "=== 3. Checking required APK entries (Manifest, DEX, Resources, ABIs) ==="
          APK_LIST=$(unzip -Z1 "${APK_PATH}")
          echo "${APK_LIST}" | grep -qx "AndroidManifest.xml" || { echo "ERROR: Missing AndroidManifest.xml"; exit 1; }
          echo "${APK_LIST}" | grep -qx "classes.dex" || { echo "ERROR: Missing classes.dex"; exit 1; }
          echo "${APK_LIST}" | grep -qx "resources.arsc" || { echo "ERROR: Missing resources.arsc"; exit 1; }
          echo "${APK_LIST}" | grep -q "^lib/arm64-v8a/" || { echo "ERROR: Missing arm64-v8a native libraries"; exit 1; }
          echo "${APK_LIST}" | grep -q "^lib/armeabi-v7a/" || { echo "ERROR: Missing armeabi-v7a native libraries"; exit 1; }

          echo "=== 4. Verifying zipalign 4-byte alignment ==="
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK_PATH}"

          echo "=== 5. Verifying APK v1/v2/v3 signatures with apksigner ==="
          SIGN_OUT=$("${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${APK_PATH}")
          echo "${SIGN_OUT}"
          echo "${SIGN_OUT}" | grep -q "Verified using v1 scheme (JAR signing): true" || { echo "ERROR: v1 signature missing"; exit 1; }
          echo "${SIGN_OUT}" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "ERROR: v2 signature missing"; exit 1; }
          echo "${SIGN_OUT}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "ERROR: v3 signature missing"; exit 1; }

          echo "=== 6. Verifying AndroidManifest badging with aapt2 ==="
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK_PATH}")
          echo "${BADGING}" | head -n 25
          echo "${BADGING}" | grep -q "package: name='com.aistudio.omkarautocut.vxrplq'" || { echo "ERROR: Invalid package name in badging"; exit 1; }
          echo "${BADGING}" | grep -q "minSdkVersion:'24'" || { echo "ERROR: Invalid minSdkVersion in badging"; exit 1; }
          echo "${BADGING}" | grep -q "launchable-activity: name='com.example.MainActivity'" || { echo "ERROR: Missing launchable MainActivity"; exit 1; }

          echo "SUCCESS: ${APK_PATH} passed all archive, manifest, ABI, alignment, and v1/v2/v3 signature checks!"

      - name: Upload OMKAR-AUTOCUT-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOCUT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
