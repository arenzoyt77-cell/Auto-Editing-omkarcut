name: Build OMKAR AUTOCUT Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Verify Installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove any stale pre-existing APK or build output directories
        run: |
          rm -rf .build-outputs build app/build artifact-output
          find . -name "*.apk" -type f -delete || true
          find . -name "*.aab" -type f -delete || true

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses and install required stable SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-arm-dbt-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_ROOT}/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "${SDK_ROOT}/licenses/android-googlexr-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "${SDK_ROOT}/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "${SDK_ROOT}/licenses/mips-android-sysimage-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-35" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable and verify gradle-wrapper.jar
        run: |
          chmod +x gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -t "gradle/wrapper/gradle-wrapper.jar" > /dev/null 2>&1; then
            echo "Restoring valid gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Prepare .env configuration from .env.example
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "${GEMINI_API_KEY_SECRET}" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}" >> .env
          fi

      - name: Prepare valid debug.keystore for debug signing
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -startdate "-3650d" \
            -validity 14000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Record pre-build timestamp marker
        run: touch /tmp/build_start_marker

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Automatically locate and validate generated Android APK
        id: verify_apk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          BUILD_TOOLS=$(find "${SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android SDK build-tools: ${BUILD_TOOLS}"

          echo "=== 1. Automatically locating APK generated by current build ==="
          FOUND_APK=$(find . -path "*/build/outputs/apk/*.apk" \
            ! -name "*androidTest*" \
            ! -name "*unsigned*" \
            -newer /tmp/build_start_marker \
            -type f | sort | head -n 1)

          if [ -z "${FOUND_APK}" ]; then
            FOUND_APK=$(find . -path "*/build/outputs/apk/*.apk" \
              ! -name "*androidTest*" \
              ! -name "*unsigned*" \
              -type f | sort | head -n 1)
          fi

          if [ -z "${FOUND_APK}" ] || [ ! -f "${FOUND_APK}" ]; then
            echo "ERROR: No generated APK found under */build/outputs/apk/"
            exit 1
          fi
          echo "Found generated APK: ${FOUND_APK}"

          APK_SIZE=$(stat -c%s "${FOUND_APK}")
          echo "Generated APK size: ${APK_SIZE} bytes"
          if [ "${APK_SIZE}" -lt 5000000 ]; then
            echo "ERROR: Generated APK is empty or suspiciously small (${APK_SIZE} bytes)."
            exit 1
          fi

          echo "=== 2. Aligning (4-byte & 4KB page-aligned) and signing APK (v1 + v2 + v3 schemes) ==="
          mkdir -p artifact-output
          STAGED_APK="artifact-output/OMKAR-AUTOCUT-debug.apk"
          "${BUILD_TOOLS}/zipalign" -f -p 4 "${FOUND_APK}" "${STAGED_APK}"

          "${BUILD_TOOLS}/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "${STAGED_APK}"

          rm -f "${STAGED_APK}.idsig"

          echo "=== 3. Verifying APK existence, size, and ZIP integrity ==="
          if [ ! -f "${STAGED_APK}" ] || [ ! -s "${STAGED_APK}" ]; then
            echo "ERROR: Staged APK is missing or empty at ${STAGED_APK}"
            exit 1
          fi
          FINAL_SIZE=$(stat -c%s "${STAGED_APK}")
          echo "Final signed APK size: ${FINAL_SIZE} bytes"
          if [ "${FINAL_SIZE}" -lt 5000000 ]; then
            echo "ERROR: Final signed APK size (${FINAL_SIZE} bytes) is invalid or truncated."
            exit 1
          fi
          unzip -t "${STAGED_APK}" > /dev/null

          echo "=== 4. Verifying required Android APK structure and native ABIs ==="
          APK_LIST=$(unzip -Z1 "${STAGED_APK}")
          echo "${APK_LIST}" | grep -qx "AndroidManifest.xml" || { echo "ERROR: Missing AndroidManifest.xml"; exit 1; }
          echo "${APK_LIST}" | grep -qx "classes.dex" || { echo "ERROR: Missing classes.dex"; exit 1; }
          echo "${APK_LIST}" | grep -qx "resources.arsc" || { echo "ERROR: Missing resources.arsc"; exit 1; }
          echo "${APK_LIST}" | grep -q "^META-INF/.*\.SF$" || { echo "ERROR: Missing META-INF v1 signature block"; exit 1; }
          echo "${APK_LIST}" | grep -q "^lib/arm64-v8a/" || { echo "ERROR: Missing arm64-v8a native libraries"; exit 1; }
          echo "${APK_LIST}" | grep -q "^lib/armeabi-v7a/" || { echo "ERROR: Missing armeabi-v7a native libraries"; exit 1; }

          echo "=== 5. Verifying zipalign, apksigner (v1+v2+v3), and AndroidManifest package parsing ==="
          "${BUILD_TOOLS}/zipalign" -c 4 "${STAGED_APK}"

          SIGN_OUT=$("${BUILD_TOOLS}/apksigner" verify --min-sdk-version 21 --verbose --print-certs "${STAGED_APK}")
          echo "${SIGN_OUT}"
          echo "${SIGN_OUT}" | grep -q "^Verifies" || { echo "ERROR: APK signature verification failed"; exit 1; }
          echo "${SIGN_OUT}" | grep -q "Verified using v1 scheme (JAR signing): true" || { echo "ERROR: v1 signature missing"; exit 1; }
          echo "${SIGN_OUT}" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "ERROR: v2 signature missing"; exit 1; }
          echo "${SIGN_OUT}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "ERROR: v3 signature missing"; exit 1; }

          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${STAGED_APK}")
          echo "${BADGING}" | head -n 25
          echo "${BADGING}" | grep -q "package: name='com.aistudio.omkarautocut.vxrplq'" || { echo "ERROR: Invalid package name"; exit 1; }
          echo "${BADGING}" | grep -q "minSdkVersion:'24'" || { echo "ERROR: Unexpected minSdkVersion"; exit 1; }
          echo "${BADGING}" | grep -q "targetSdkVersion:'35'" || { echo "ERROR: Unexpected targetSdkVersion"; exit 1; }
          echo "${BADGING}" | grep -q "launchable-activity: name='com.example.MainActivity'" || { echo "ERROR: Missing launchable MainActivity"; exit 1; }

          echo "apk_path=${STAGED_APK}" >> "${GITHUB_OUTPUT}"
          echo "apk_size=${FINAL_SIZE}" >> "${GITHUB_OUTPUT}"

      - name: Upload OMKAR-AUTOCUT-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOCUT-APK
          path: ${{ steps.verify_apk.outputs.apk_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct unzipped .apk file to GitHub Releases for instant Android installation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest-apk"
          APK_FILE="${{ steps.verify_apk.outputs.apk_path }}"
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_FILE}#OMKAR-AUTOCUT-debug.apk" --clobber --repo "${GITHUB_REPOSITORY}" || true
          else
            gh release create "${TAG_NAME}" "${APK_FILE}#OMKAR-AUTOCUT-debug.apk" \
              --title "OMKAR AUTOCUT Latest Installable APK" \
              --notes "Direct installable Android APK (OMKAR-AUTOCUT-debug.apk) built by GitHub Actions." \
              --repo "${GITHUB_REPOSITORY}" || true
          fi

      - name: Confirm APK Ready for Download
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/OMKAR-AUTOCUT-debug.apk"
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "APK READY FOR DOWNLOAD"
          echo "Artifact Name: OMKAR-AUTOCUT-APK"
          echo "File: ${{ steps.verify_apk.outputs.apk_path }} (${{ steps.verify_apk.outputs.apk_size }} bytes)"
          echo "Direct Unzipped APK URL: ${DIRECT_URL}"
          echo "=========================================="
          {
            echo "## BUILD SUCCESSFUL"
            echo "### APK READY FOR DOWNLOAD"
            echo "- **Direct `.apk` Download (No ZIP — Tap to Install on Android):** [Download OMKAR-AUTOCUT-debug.apk](${DIRECT_URL})"
            echo "- **GitHub Actions Artifact Name:** \`OMKAR-AUTOCUT-APK\`"
            echo "- **APK File Inside Artifact:** \`OMKAR-AUTOCUT-debug.apk\` (\`${{ steps.verify_apk.outputs.apk_size }}\` bytes)"
            echo "- **Note for Android Users:** When downloading from the **Artifacts** section below, GitHub automatically wraps artifacts in \`OMKAR-AUTOCUT-APK.zip\`. Extract the \`.zip\` first (do **not** rename \`.zip\` to \`.apk\`) to install \`OMKAR-AUTOCUT-debug.apk\`, or use the **Direct \`.apk\` Download** link above."
          } >> "${GITHUB_STEP_SUMMARY}"
